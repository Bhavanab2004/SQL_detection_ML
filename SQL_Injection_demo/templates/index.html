
<!DOCTYPE html>
<html>
<head>
    <title>SQL Injection Detection Demo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            width: 360px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
        }

        h2 {
            text-align: center;
            color: #1e293b;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border-radius: 6px;
        }

        input, select {
            border: 1px solid #cbd5e1;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 18px;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            text-align: center;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .failure {
            background: #fee2e2;
            color: #991b1b;
        }

        pre {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            background: #f1f5f9;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
        }

        label {
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>SQL Injection Demo</h2>

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Enter Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Enter Password"
            required
        >

        <label>Select Login Mode:</label>

        <select name="mode">
            <option value="vulnerable">Vulnerable Login</option>
            <option value="secure">Secure Login</option>
        </select>

        <button type="submit">Login</button>

    </form>

    {% if message %}
        <div class="result {{ 'success' if success else 'failure' }}">
            {{ message }}
        </div>
    {% endif %}

    {% if query %}
        <h4>Generated SQL Query:</h4>
        <pre>{{ query }}</pre>
    {% endif %}

</div>

</body>
</html>
